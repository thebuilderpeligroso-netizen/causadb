[pytest]
markers =
    unit: fast tests, mocked dependencies (< 1s each)
    integration: slow tests, real services/systemd (1-30s each)
    anti_teatro: tests that verify REAL behavior, MUST NOT be mocked
    benchmark: performance benchmarks, run separately with --run-benchmarks

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default timeout for unit tests
timeout = 10

# Disable warnings for cleaner output
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
