<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CausaDB · Ledger Intelligence</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login-view" class="login-view" hidden>
    <main class="login-card" aria-labelledby="login-title">
      <div class="brand-mark">C</div><p class="eyebrow">Ledger Intelligence</p>
      <h1 id="login-title">Tu operación,<br><em>con contexto.</em></h1>
      <p class="muted">Introduce tu llave API para abrir el espacio de trabajo.</p>
      <form id="login-form"><label for="api-key-input">Llave API</label><input id="api-key-input" type="password" autocomplete="off" required placeholder="sk-…" /><button class="primary full" type="submit">Entrar al ledger <span>→</span></button><p id="login-error" class="error" role="alert"></p></form>
    </main>
  </div>
  <div id="app" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">C</div><div><strong>CausaDB</strong><span>Ledger Intelligence</span></div></div>
      <div class="workspace-select"><span class="status-dot"></span><div><small>WORKSPACE</small><strong id="workspace-name">CausaDB / Principal</strong></div><span class="chevron">⌄</span></div>
      <nav class="nav" aria-label="Navegación principal"><p class="nav-label">VISTA</p><button class="nav-item active" data-view="summary"><span class="nav-icon">◒</span>Resumen</button><button class="nav-item" data-view="ledger"><span class="nav-icon">⌁</span>Ledger<span class="nav-count" id="event-count">—</span></button><button class="nav-item" data-view="fleet"><span class="nav-icon">◫</span>Flota<span class="nav-count" id="fleet-count">—</span></button><button class="nav-item" data-view="trades"><span class="nav-icon">↗</span>Trades</button></nav>
      <div class="sidebar-bottom"><button class="nav-item"><span class="nav-icon">?</span>Ayuda</button><div class="user-row"><div class="avatar" id="user-avatar">JD</div><div><strong id="user-name">Sesión local</strong><span id="user-email">API autenticada</span></div><button id="logout" class="icon-button" aria-label="Cerrar sesión" title="Olvidar llave">↪</button></div></div>
    </aside>
    <main class="main-content"><header class="topbar"><div class="crumbs"><span>CausaDB</span><b>/</b><strong id="view-title">Resumen</strong></div><div class="top-actions"><button class="telemetry" id="telemetry-toggle"><span class="pulse"></span> Telemetría <b>ON</b></button><button class="icon-button" id="chat-button" aria-label="Abrir asistente">✦</button></div></header>
      <div id="page-content"></div>
    </main>
  </div>
  <div id="detail-modal" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><div><p class="eyebrow">PRUEBA DEL LEDGER</p><h2 id="modal-title">Detalle del evento</h2></div><button class="icon-button" data-close-modal aria-label="Cerrar">×</button></header><div id="modal-body"></div><footer><button class="secondary" data-close-modal>Cerrar</button><button class="primary" id="revive-button">Revive-to <span>↗</span></button></footer></section></div>
  <script src="trades.js" defer></script><script src="app.js" defer></script>
</body>
</html>
